name: Mirror to Azure Repos
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to Azure
        run: |
          git push --force \
            "https://x-access-token:${AZURE_PAT}@dev.azure.com/simeonlhearring/odyl/_git/odyl-design" \
            HEAD:refs/heads/github-sync
        env:
          AZURE_PAT: ${{ secrets.AZURE_PAT }}
