<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ODYL Health</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="phone-frame home-page">

  <div class="status-bar">
    <span>9:41</span>
    <div class="status-bar-icons">
      <span>&#9679;&#9679;&#9679;&#9679;</span>
      <span>&#x1F50B;</span>
    </div>
  </div>

  <div id="odyl-header-mount"></div>

  <div class="welcome-banner">
    <h2 id="welcome-text">Welcome</h2>
    <p class="welcome-tagline">Track care, find support, and manage your health tools.</p>
  </div>

  <a href="calendar.html" class="home-next-step" id="home-next-step">
    <span class="home-next-step-label">Suggested next step</span>
    <h3 class="home-next-step-title" id="next-step-title">Loading…</h3>
    <p class="home-next-step-body" id="next-step-body"></p>
    <span class="home-next-step-cta" id="next-step-cta">Continue</span>
  </a>

  <div class="home-dashboard" id="home-dashboard">
    <section class="home-section" aria-labelledby="home-section-track">
      <h3 class="home-section-title" id="home-section-track">Track</h3>
      <div class="feature-grid feature-grid--home">
        <a href="calendar.html" class="feature-tile">
          <div class="feature-icon" data-icon="calendar"></div>
          <span class="feature-label">Calendar</span>
        </a>
        <a href="results.html" class="feature-tile">
          <div class="feature-icon" data-icon="clipboard"></div>
          <span class="feature-label">Results</span>
        </a>
        <a href="survey.html" class="feature-tile">
          <div class="feature-icon" data-icon="survey"></div>
          <span class="feature-label">RiskCheck</span>
        </a>
        <a href="rewards.html" class="feature-tile">
          <div class="feature-icon" data-icon="medal"></div>
          <span class="feature-label">Rewards</span>
        </a>
      </div>
    </section>

    <section class="home-section" aria-labelledby="home-section-learn">
      <h3 class="home-section-title" id="home-section-learn">Learn</h3>
      <div class="feature-grid feature-grid--home">
        <a href="education.html" class="feature-tile">
          <div class="feature-icon" data-icon="book"></div>
          <span class="feature-label">Education</span>
        </a>
        <a href="lumi.html" class="feature-tile">
          <div class="feature-icon" data-icon="chat"></div>
          <span class="feature-label">LUMI.AI</span>
        </a>
      </div>
    </section>

    <section class="home-section" aria-labelledby="home-section-support">
      <h3 class="home-section-title" id="home-section-support">Get Support</h3>
      <div class="feature-grid feature-grid--home">
        <a href="locator.html" class="feature-tile">
          <div class="feature-icon" data-icon="mapPin"></div>
          <span class="feature-label">Health Locator</span>
        </a>
        <a href="support.html" class="feature-tile">
          <div class="feature-icon" data-icon="heartHands"></div>
          <span class="feature-label">Support</span>
        </a>
      </div>
    </section>

    <section class="home-section" aria-labelledby="home-section-profile">
      <h3 class="home-section-title" id="home-section-profile">Manage Profile</h3>
      <div class="feature-grid feature-grid--home">
        <a href="profile.html" class="feature-tile">
          <div class="feature-icon" data-icon="gear"></div>
          <span class="feature-label">Profile</span>
        </a>
      </div>
    </section>
  </div>

  <div id="odyl-nav-mount"></div>

</div>

<script src="js/odyl.js"></script>
<script>
  (function () {
    var persona = ODYL.requirePersona();
    if (!persona) return;

    ODYL.mountHeader('#odyl-header-mount', 'home');
    ODYL.mountBottomNav('#odyl-nav-mount', 'home');

    document.getElementById('welcome-text').textContent = 'Welcome, ' + persona.First_Name;

    document.querySelectorAll('.feature-icon[data-icon]').forEach(function (el) {
      var k = el.getAttribute('data-icon');
      if (ODYL.Icons[k]) el.innerHTML = ODYL.Icons[k]();
    });

    var step = ODYL.getHomeNextStep(persona);
    var nextLink = document.getElementById('home-next-step');
    nextLink.href = step.href;
    document.getElementById('next-step-title').textContent = step.title;
    document.getElementById('next-step-body').textContent = step.body;
    document.getElementById('next-step-cta').textContent = step.cta;
    if (step.label) {
      document.querySelector('.home-next-step-label').textContent = step.label;
    }
  })();
</script>

</body>
</html>
